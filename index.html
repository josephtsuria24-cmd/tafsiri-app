<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tafsiri App - English Swahili Translator</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16A34A">
</head><body>
<div class="container">
  <h1>🌍 Tafsiri App</h1>
  <p>English ↔ Kiswahili Translator</p>

  <div class="tabs">
    <button class="tab-btn active" onclick="setLang('en-sw')">English to Swahili</button>
    <button class="tab-btn" onclick="setLang('sw-en')">Swahili to English</button>
  </div>

  <textarea id="inputText" placeholder="Type here..."></textarea>
  <button onclick="translate()" class="btn">Translate / Tafsiri</button>

  <div class="result-box">
    <h3>Translation:</h3>
    <p id="outputText"></p>
    <button onclick="copyText()" class="btn-small">📋 Copy</button>
    <button onclick="speakText()" class="btn-small">🔊 Speak</button>
  </div>
</div>
<script src="script.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script></body></html>
