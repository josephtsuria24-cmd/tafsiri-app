
 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tafsiri App AI</title>
<style>
body{font-family:Arial;background:#e8f5e9;text-align:center;padding:20px;margin:0}
.box{background:white;padding:25px;border-radius:20px;max-width:600px;margin:auto;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h1{color:#2e7d32}
.btn-group{display:flex;gap:10px;margin:15px 0}
.btn{flex:1;background:#2e7d32;color:white;border:none;padding:12px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.btn.active{background:#1b5e20}
textarea{width:90%;padding:14px;font-size:16px;border:2px solid #2e7d32;border-radius:10px;margin:10px 0;min-height:100px}
#result{font-size:20px;color:#2e7d32;font-weight:bold;margin:20px 0;min-height:60px;padding:15px;background:#f1f8e9;border-radius:10px;text-align:left}
.action-btns{display:flex;gap:10px;justify-content:center}
.action-btn{background:#4caf50;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px}
.loading{color:#ff9800}
</style>
</head>
<body>
<div class="box">
<h1>🌍 Tafsiri App AI</h1>
<p>Translate Full Sentences</p>

<div class="btn-group">
<button id="btnEn" class="btn active" onclick="setDir('en')">English → Swahili</button>
<button id="btnSw" class="btn" onclick="setDir('sw')">Swahili → English</button>
</div>

<textarea id="word" placeholder="Type a sentence here..."></textarea>
<br>
<button class="btn" onclick="doTranslate()">Translate / Tafsiri</button>

<div id="result"></div>

<div class="action-btns">
<button class="action-btn" onclick="copyText()">📋 Copy</button>
<button class="action-btn" onclick="speakText()">🔊 Speak</button>
</div>
<p style="font-size:12px;color:gray">Powered by LibreTranslate - Free AI</p>
</div>

<script>
let direction = 'en';

function setDir(dir){
  direction = dir;
  document.getElementById('btnEn').classList.toggle('active', dir==='en');
  document.getElementById('btnSw').classList.toggle('active', dir==='sw');
  document.getElementById('word').placeholder = dir==='en'? "Type English sentence" : "Andika sentensi ya Kiswahili";
  document.getElementById('result').innerText = "";
}

async function doTranslate(){
  let text = document.getElementById('word').value.trim();
  if(!text) return;
  
  document.getElementById('result').innerText = "Translating...";
  document.getElementById('result').classList.add('loading');
  
  const source = direction==='en'? 'en' : 'sw';
  const target = direction==='en'? 'sw' : 'en';
  
  try {
    let res = await fetch("https://libretranslate.de/translate", {
      method: "POST",
      body: JSON.stringify({q: text, source: source, target: target, format: "text"}),
      headers: {"Content-Type": "application/json"}
    });
    let data = await res.json();
    document.getElementById('result').innerText = data.translatedText;
  } catch(e) {
    document.getElementById('result').innerText = "Error. Try again or check internet";
  }
  document.getElementById('result').classList.remove('loading');
}

function copyText(){
  let text = document.getElementById('result').innerText;
  navigator.clipboard.writeText(text);
  alert("Copied!");
}

function speakText(){
  let text = document.getElementById('result').innerText;
  let lang = direction==='en'? 'sw-TZ' : 'en-US';
  let msg = new SpeechSynthesisUtterance(text);
  msg.lang = lang;
  speechSynthesis.speak(msg);
}
</script>
</body>
</html>
