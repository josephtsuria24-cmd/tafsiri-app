  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tafsiri App Pro</title>
<style>
body{font-family:Arial;background:#e8f5e9;text-align:center;padding:20px;margin:0}
.box{background:white;padding:25px;border-radius:20px;max-width:600px;margin:auto;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
h1{color:#2e7d32}
.btn-group{display:flex;gap:10px;margin:15px 0}
.btn{flex:1;background:#2e7d32;color:white;border:none;padding:12px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
.btn.active{background:#1b5e20}
textarea{width:90%;padding:14px;font-size:16px;border:2px solid #2e7d32;border-radius:10px;margin:10px 0;min-height:100px}
#result{font-size:22px;color:#2e7d32;font-weight:bold;margin:20px 0;min-height:60px;padding:15px;background:#f1f8e9;border-radius:10px;text-align:center}
.action-btns{display:flex;gap:10px;justify-content:center}
.action-btn{background:#4caf50;color:white;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<div class="box">
<h1>🌍 Tafsiri App Pro</h1>
<p>Works Offline</p>

<div class="btn-group">
<button id="btnEn" class="btn active" onclick="setDir('en')">English → Swahili</button>
<button id="btnSw" class="btn" onclick="setDir('sw')">Swahili → English</button>
</div>

<textarea id="word" placeholder="Type here..."></textarea>
<br>
<button class="btn" onclick="doTranslate()">Translate / Tafsiri</button>

<div id="result">Result will appear here</div>

<div class="action-btns">
<button class="action-btn" onclick="copyText()">📋 Copy</button>
<button class="action-btn" onclick="speakText()">🔊 Speak</button>
</div>
</div>

<script>
let direction = 'en';

// BIG DICTIONARY
const dictEnToSw = {
"i":"mimi", "you":"wewe", "he":"yeye", "she":"yeye", "we":"sisi", "they":"wao",
"love":"penda", "like":"penda", "am":"ni", "is":"ni", "are":"ni", "was":"kuwa",
"the":"", "a":"", "an":"",
"hello":"jambo", "hi":"salamu", "how":"vipi", "are":"uko", "you":"we", "today":"leo",
"thank":"asante", "thanks":"asante", "water":"maji", "food":"chakula", "eat":"kula",
"school":"shule", "book":"kitabu", "house":"nyumba", "home":"nyumbani", "friend":"rafiki",
"money":"pesa", "car":"gari", "good":"nzuri", "bad":"mbaya", "big":"kubwa", "small":"ndogo",
"yes":"ndiyo", "no":"hapana", "please":"tafadhali", "sorry":"samahani", "help":"msaada",
"name":"jina", "my":"yangu", "your":"yako", "work":"kazi", "go":"nenda", "come":"kuja",
"sleep":"lala", "goodbye":"kwaheri", "morning":"asubuhi", "night":"usiku", "day":"siku""i love you":"nakupenda", 
"how are you":"habari yako",
"thank you":"asante",
"good morning":"habari ya asubuhi",
"good night":"lala salama",
"what is your name":"jina lako nani",
};

// Create reverse dictionary
const dictSwToEn = {};
for(let key in dictEnToSw){
  if(dictEnToSw[key]) dictSwToEn[dictEnToSw[key]] = key;
}

function setDir(dir){
  direction = dir;
  document.getElementById('btnEn').classList.toggle('active', dir==='en');
  document.getElementById('btnSw').classList.toggle('active', dir==='sw');
  document.getElementById('word').placeholder = dir==='en'? "Type English" : "Andika Kiswahili";
  document.getElementById('result').innerText = "Result will appear here";
}

function doTranslate(){
  let text = document.getElementById('word').value.toLowerCase().trim();
  let dict = direction==='en'? dictEnToSw : dictSwToEn;

  // Split into words and translate each
  let words = text.split(" ");
  let translated = [];

  for(let w of words){
    w = w.replace(/[.,!?]/g, ""); // remove punctuation
    translated.push(dict[w] || "["+w+"]"); // if not found, show [word]
  }

  document.getElementById('result').innerText = translated.join(" ");
}

function copyText(){
  let text = document.getElementById('result').innerText;
  navigator.clipboard.writeText(text);
  alert("Copied!");
}

function speakText(){
  let text = document.getElementById('result').innerText;
  let lang = direction==='en'? 'sw-TZ' : 'en-US';
  let msg = new SpeechSynthesisUtterance(text);
  msg.lang = lang;
  speechSynthesis.speak(msg);
}
</script>
</body>
</html>
